name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a change in an agent's installer or config format shows up
  # here before a customer hits it.
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

# Failures are repeated as error annotations (.github/scripts/annotate-failure.sh):
# job logs need admin rights to read, annotations are public.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet and test
        shell: bash
        run: |
          mkdir -p logs
          go vet ./... 2>&1 | tee logs/test.log
          go test ./... 2>&1 | tee -a logs/test.log
      - name: Report failure
        if: failure()
        shell: bash
        run: .github/scripts/annotate-failure.sh "test (${{ runner.os }})" logs/test.log

  # The one-line install exactly as a person runs it, on a real machine of
  # each OS: bootstrap script, vendor installers, setup, every agent answering
  # through the mock, doctor and uninstall.
  e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build CLI and mock
        shell: bash
        run: |
          mkdir -p e2e/dl
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=0.0.0-e2e" -o "e2e/dl/vikey-$os-$arch$ext" ./cmd/vikey
          done
          go build -o e2e/mockapi$( [ "$RUNNER_OS" = Windows ] && echo .exe ) ./tools/mockapi
          go build -o e2e/e2echeck$( [ "$RUNNER_OS" = Windows ] && echo .exe ) ./tools/e2echeck

      - name: Start mock
        shell: bash
        run: |
          nohup e2e/mockapi -addr 127.0.0.1:18080 -dl e2e/dl -bootstrap bootstrap > e2e/mock.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/i/E2ETEST1 >/dev/null && break; sleep 1; done

      - name: One-line install (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VIKEY_SETUP_ARGS: --yes --tools all
        run: curl -fsSL http://127.0.0.1:18080/i/E2ETEST1 | sh 2>&1 | tee e2e/install.log

      # Windows PowerShell 5.1, what most people have.
      - name: One-line install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          VIKEY_SETUP_ARGS: --yes --tools all
        run: |
          # Actions starts this shell with 'Stop', which would end the capture
          # at the first stderr line of an installer.
          $ErrorActionPreference = 'Continue'
          $code = 1
          $out = ''
          try {
            $out = irm http://127.0.0.1:18080/i/E2ETEST1.ps1 | iex *>&1 | Out-String
            $code = $LASTEXITCODE
          } catch {
            $out += "`nEXCEPTION: $($_ | Out-String)"
          } finally {
            Write-Host $out
            [IO.File]::WriteAllText("$PWD\e2e\install.log", $out)
          }
          if ($code -ne 0) { exit $code }

      - name: Agents answer through Vikey, doctor, uninstall
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            vikey="$USERPROFILE/.vikey/bin/vikey.exe"; check=e2e/e2echeck.exe
          else
            vikey="$HOME/.vikey/bin/vikey"; check=e2e/e2echeck
          fi
          "$check" -mock http://127.0.0.1:18080 -vikey "$vikey"

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          .github/scripts/annotate-failure.sh "install (${{ runner.os }})" e2e/install.log
          .github/scripts/annotate-failure.sh "mock requests (${{ runner.os }})" e2e/mock.log

      - name: Mock log
        if: always()
        shell: bash
        run: tail -n 200 e2e/mock.log || true
